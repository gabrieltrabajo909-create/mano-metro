<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0E13">
<title>Mano Metro</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script>
<style>
:root{
  --bg:#0B0E13; --panel:rgba(14,18,25,.86); --line:#27303D; --ink:#EEF2F7; --muted:#8E9AAB;
  --accent:#FFB020; --accent-ink:#1A1204; --good:#43C487; --bad:#EF6F5C;
  --font:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono:ui-monospace, "SF Mono", Menlo, "Roboto Mono", monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.4 var(--font);overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.stage{position:fixed;inset:0;background:#000}
video,#overlay,#gl{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mirror{transform:scaleX(-1)}

.top{position:fixed;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;display:flex;flex-direction:column;gap:8px;align-items:center;background:linear-gradient(#000b,#0000)}
.toprow{width:100%;display:flex;justify-content:space-between;align-items:center}
.lang{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px}
.lang button{padding:7px 11px;border-radius:999px;font-weight:800;font-size:13px;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{padding:8px 14px;border-radius:999px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.icon{width:42px;height:42px;border-radius:50%;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.icon svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.readout{position:fixed;left:50%;top:calc(118px + env(safe-area-inset-top,0px));transform:translateX(-50%);text-align:center;pointer-events:none;width:max-content;max-width:calc(100% - 32px)}
.readout .v{font:800 64px/1 var(--font);letter-spacing:-.03em;font-variant-numeric:tabular-nums;text-shadow:0 2px 12px #000}
.readout .v small{font-size:26px;font-weight:700;margin-left:4px}
.guide{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:10px}
.bubble{width:58px;height:58px;flex:none;filter:drop-shadow(0 1px 4px #000)}
.pill{display:inline-block;max-width:15em;text-align:left;padding:5px 12px;border-radius:99px;font:700 13px var(--font);background:var(--panel);border:1px solid var(--line);color:var(--muted)}
.pill.ok{color:var(--good);border-color:var(--good)}
.pill.warn{color:var(--bad);border-color:var(--bad)}
.alt{font:600 12px var(--mono);color:var(--muted);margin-top:6px;text-shadow:0 1px 6px #000}

.bottom{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;background:linear-gradient(#0000,#000c 40%)}
.row{display:flex;gap:10px}
.btn{flex:1;height:56px;border-radius:16px;font-weight:800;font-size:17px;background:var(--panel);border:1px solid var(--line)}
.btn.main{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:disabled{opacity:.4}
.hist{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.hist::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 10px;font:600 13px var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.planebar{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.planebar button{flex:none;height:48px;padding:0 14px;border-radius:14px;font-weight:800;font-size:15px;background:var(--panel);border:1px solid var(--line)}
.planebar button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.credits{font:500 10.5px var(--font);color:var(--muted);text-align:center;line-height:1.3}
.chip span{color:var(--muted);font-weight:500;margin-left:6px}

/* calibración con foto */
.cal{position:fixed;inset:0;z-index:5;background:var(--bg);display:flex;flex-direction:column}
.cal header{padding:calc(14px + env(safe-area-inset-top,0px)) 16px 10px;display:flex;flex-direction:column;gap:4px}
.cal h2{margin:0;font-size:20px}
.cal p{margin:0;color:var(--muted);font-size:15px}
.cal p b{color:var(--ink)}
.cal .canvaswrap{flex:1;position:relative;min-height:0}
#calcanvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.cal footer{padding:10px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
.result{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.result div{background:#121821;border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.result b{display:block;font:800 20px var(--font);font-variant-numeric:tabular-nums}
.result span{font-size:12px;color:var(--muted)}
.steps{display:flex;flex-direction:column;gap:10px;padding:0 16px;overflow:auto}
.steps ol{margin:0;padding-left:20px;color:var(--muted);display:flex;flex-direction:column;gap:8px}
.steps li b{color:var(--ink)}
.center{flex:1;display:flex;align-items:center;justify-content:center;color:var(--muted);padding:20px;text-align:center}

.status{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 20px;text-align:center;max-width:calc(100% - 40px)}
.status b{display:block;margin-bottom:4px}
.toast{position:fixed;left:50%;top:calc(260px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;max-width:calc(100% - 32px);text-align:center;z-index:10}
</style>
</head>
<body>
<div class="stage">
  <video id="video" playsinline muted></video>
  <canvas id="overlay"></canvas>
  <canvas id="gl" hidden></canvas>
</div>

<header class="top">
  <div class="toprow">
    <div class="lang" role="group" aria-label="Idioma / Language">
      <button id="l-es" aria-pressed="true">ES</button>
      <button id="l-en" aria-pressed="false">EN</button>
    </div>
    <div class="seg" role="tablist">
      <button id="t-measure" aria-pressed="true" data-i18n="tabMeasure"></button>
      <button id="t-plane" aria-pressed="false" data-i18n="tabPlane"></button>
    </div>
  <button class="icon" id="flip" data-i18n-aria="flip"><svg viewBox="0 0 24 24"><path d="M4 7h3l2-2h6l2 2h3v12H4z"/><path d="M9 13a3 3 0 0 0 5.2 2M15 11a3 3 0 0 0-5.2-2"/></svg></button>
  </div>
  <div class="seg" role="group" id="fingerseg">
    <button id="m-index" aria-pressed="true" data-i18n="modeIndex"></button>
    <button id="m-pinky" aria-pressed="false" data-i18n="modePinky"></button>
  </div>
</header>

<div class="readout" aria-live="polite">
  <div class="v" id="value">—</div>
  <div class="guide">
    <svg class="bubble" id="bubble" viewBox="-30 -30 60 60" aria-hidden="true">
      <circle r="28" fill="rgba(14,18,25,.8)" stroke="#27303D" stroke-width="2"/>
      <circle id="ring" r="11.8" fill="none" stroke="#8E9AAB" stroke-width="2" stroke-dasharray="3 3"/>
      <line x1="-28" y1="0" x2="28" y2="0" stroke="#27303D"/><line x1="0" y1="-28" x2="0" y2="28" stroke="#27303D"/>
      <circle id="dot" r="6" fill="#8E9AAB"/>
    </svg>
    <div class="pill" id="pill"></div>
  </div>
  <div class="alt" id="alt"></div>
</div>

<footer class="bottom">
  <div class="planebar" id="planebar" hidden>
    <button data-plane="fw190">Fw 190</button>
    <button data-plane="spitfire">Spitfire</button>
    <button data-plane="zero">A6M Zero</button>
    <button data-plane="mustang">P-51 Mustang</button>
    <button id="invert" data-i18n="invert"></button>
  </div>
  <div class="credits" id="credits" hidden></div>
  <div class="hist" id="hist"></div>
  <div class="row" id="measurerow">
    <button class="btn" id="cal" data-i18n="calBtn"></button>
    <button class="btn main" id="measure" disabled data-i18n="measure"></button>
  </div>
</footer>

<!-- calibración: paso 1 instrucciones, paso 2 tocar esquinas -->
<section class="cal" id="calview" hidden>
  <header>
    <h2 id="caltitle">Calibrar tu mano</h2>
    <p id="calhint"></p>
  </header>
  <div class="steps" id="calsteps">
    <ol data-i18n-html="steps"></ol>
  </div>
  <div class="canvaswrap" id="calwrap" hidden><canvas id="calcanvas"></canvas></div>
  <div class="center" id="calbusy" hidden data-i18n="searching"></div>
  <footer>
    <div class="result" id="calresult" hidden></div>
    <div class="row">
      <button class="btn" id="calcancel" data-i18n="cancel"></button>
      <button class="btn" id="calphoto"></button>
      <button class="btn main" id="calsave" hidden disabled data-i18n="save"></button>
    </div>
  </footer>
  <input type="file" id="calfile" accept="image/*" capture="environment" hidden>
</section>

<div class="status" id="status"><b data-i18n="loading"></b><span data-i18n="loadingTxt"></span></div>
<div class="toast" id="toast" hidden></div>

<script type="module">
import { FilesetResolver, HandLandmarker } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/vision_bundle.mjs';

const $ = s => document.querySelector(s);
const video = $('#video'), canvas = $('#overlay'), ctx = canvas.getContext('2d');
const TIP = { thumb: 4, index: 8, pinky: 20 };
const PALM = [0, 5, 9, 13, 17];                                     // muñeca y nudillos: la parte rígida de la mano
const PALM_PAIRS = [[0,5],[0,9],[0,17],[5,17],[5,9],[9,13],[13,17]];
const A4 = [21, 29.7];

// ---------- idiomas ----------
const T = {
  es: {
    modeIndex:'Pulgar–Índice', modePinky:'Pulgar–Meñique', flip:'Cambiar cámara', calBtn:'Calibrar mano', measure:'Medir',
    loading:'Cargando…', loadingTxt:'Preparando la cámara y el detector de manos', failed:'Algo falló',
    loadFail:'No se pudo cargar el detector de manos. Revisá la conexión y volvé a abrir la app.',
    camFail:'La app necesita la cámara. Dale permiso en el navegador y volvé a abrirla.',
    showHand:'Mostrá tu mano a la cámara', calFirst:'Calibrá tu mano primero',
    closer:'Acercá la mano a la cámara', farther:'Alejá un poco la mano', center:'Centrá la mano en la pantalla',
    turn:'Girá la mano ↔ hasta que el punto quede adentro del círculo', tilt:'Inclinala ↕ hasta que el punto quede adentro del círculo',
    still:'Bien, quedate quieto', ready:'✓ Listo para medir', measuring:'Midiendo… {p}%',
    measureFail:'No pude medir: mantené la mano de frente y quieta', flat:'plano: {v} cm',
    calTitle:'Calibrar tu mano', calHas:'Ya tenés una calibración. Hacé otra si querés mejorarla.', calNew:'Se hace <b>una sola vez</b> y sirve para siempre.',
    steps:'<li>Poné una <b>hoja A4</b> sobre una mesa.</li><li>Apoyá la mano <b>abierta y plana</b> sobre la hoja, con los dedos separados y toda la mano adentro de la hoja.</li><li>Sacá la foto <b>desde arriba</b>, que se vean las <b>4 esquinas</b> de la hoja.</li><li>Después tocás las 4 esquinas en la foto y listo. Se hace una sola vez.</li>',
    photo:'Sacar foto', otherPhoto:'Otra foto', cancel:'Cancelar', save:'Guardar', searching:'Buscando tu mano en la foto…',
    openFail:'No pude abrir la foto. Probá con otra.', detFail:'No se pudo cargar el detector.',
    noHand:'No encontré tu mano en la foto. Probá con más luz y la mano bien abierta.',
    tapCorners:'Tocá las 4 esquinas de la hoja ({n}/4)', dragHint:'Después podés arrastrarlas para ajustarlas.', review:'Revisá y guardá',
    palmW:'ancho de palma (nudillos)', handLen:'largo de mano', span:'pulgar–meñique abierto',
    ruler:'Si querés, medí el ancho de tu palma con una regla para comprobar.', weird:'Las medidas salieron raras: revisá que las esquinas estén bien puestas.',
    calibrated:'Mano calibrada', idx:'índ', pky:'meñ',
    tabMeasure:'Medir', tabPlane:'Avión', invert:'↕ Invertir', planeHint:'Mano plana: la cola va en la muñeca, la nariz hacia el dedo mayor', planeLoading:'Cargando aviones…'
  },
  en: {
    modeIndex:'Thumb–Index', modePinky:'Thumb–Pinky', flip:'Switch camera', calBtn:'Calibrate hand', measure:'Measure',
    loading:'Loading…', loadingTxt:'Getting the camera and hand detector ready', failed:'Something went wrong',
    loadFail:'Could not load the hand detector. Check your connection and reopen the app.',
    camFail:'The app needs the camera. Allow it in your browser and reopen the app.',
    showHand:'Show your hand to the camera', calFirst:'Calibrate your hand first',
    closer:'Move your hand closer to the camera', farther:'Move your hand back a bit', center:'Center your hand on the screen',
    turn:'Turn your hand ↔ until the dot is inside the circle', tilt:'Tilt your hand ↕ until the dot is inside the circle',
    still:'Good, hold still', ready:'✓ Ready to measure', measuring:'Measuring… {p}%',
    measureFail:'Could not measure: keep your hand facing the camera and still', flat:'flat: {v} cm',
    calTitle:'Calibrate your hand', calHas:'You already have a calibration. Do another one to improve it.', calNew:'You do it <b>once</b> and it works from then on.',
    steps:'<li>Put an <b>A4 sheet</b> on a table.</li><li>Lay your hand <b>open and flat</b> on the sheet, fingers spread, the whole hand inside the sheet.</li><li>Take the photo <b>from above</b> so all <b>4 corners</b> of the sheet are visible.</li><li>Then tap the 4 corners on the photo and you are done. Only once.</li>',
    photo:'Take photo', otherPhoto:'Retake', cancel:'Cancel', save:'Save', searching:'Looking for your hand in the photo…',
    openFail:'Could not open the photo. Try another one.', detFail:'Could not load the detector.',
    noHand:'No hand found in the photo. Try more light and a wide-open hand.',
    tapCorners:'Tap the 4 corners of the sheet ({n}/4)', dragHint:'You can drag them afterwards to adjust.', review:'Check and save',
    palmW:'palm width (knuckles)', handLen:'hand length', span:'thumb–pinky spread',
    ruler:'Optional: check your palm width with a ruler.', weird:'The numbers look off: check the corners are placed right.',
    calibrated:'Hand calibrated', idx:'idx', pky:'pnk',
    tabMeasure:'Measure', tabPlane:'Plane', invert:'↕ Flip', planeHint:'Flat hand: tail at your wrist, nose toward your middle finger', planeLoading:'Loading planes…'
  }
};
let lang = (() => { try { const l = localStorage.getItem('mano-metro-lang'); if (l) return l; } catch {} return (navigator.language || '').toLowerCase().startsWith('es') ? 'es' : 'en'; })();
const t = (k, v = {}) => (T[lang][k] || k).replace(/\{(\w+)\}/g, (_, x) => v[x]);
function applyLang(){
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-html]').forEach(el => el.innerHTML = t(el.dataset.i18nHtml));
  document.querySelectorAll('[data-i18n-aria]').forEach(el => el.setAttribute('aria-label', t(el.dataset.i18nAria)));
  $('#l-es').setAttribute('aria-pressed', lang === 'es'); $('#l-en').setAttribute('aria-pressed', lang === 'en');
  renderHist();
}
function setLang(l){ lang = l; try { localStorage.setItem('mano-metro-lang', l); } catch {} applyLang(); if (!$('#calview').hidden) refreshCalText(); }

// ---------- estado guardado en el teléfono ----------
// hand = { pts: [[x,y] ×21 en cm, mano plana sobre la hoja], at }
const LS = 'mano-metro-v1';
let saved = { hand: null, history: [] };
try { const d = JSON.parse(localStorage.getItem(LS)); if (d) saved = { hand: d.hand || null, history: d.history || [] }; } catch {}
const save = () => { try { localStorage.setItem(LS, JSON.stringify(saved)); } catch {} };

let mode = 'index', facing = 'environment';
let files, landmarker, imgLandmarker, stream, lastTs = -1, paused = false;
const recent = [], recent2d = [];
let collecting = null;
let tiltS = { x: 0, y: 0, a: 0 };   // inclinación suavizada para la guía

// ---------- geometría ----------
const d2 = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
const d3 = (a, b) => Math.hypot(a.x - b.x, a.y - b.y, a.z - b.z);
const median = a => { const s = [...a].sort((x, y) => x - y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m-1] + s[m]) / 2; };

// homografía por mínimos cuadrados (4 o más puntos): src [x,y] → dst [u,v]
function homography(src, dst){
  const M = Array.from({ length: 8 }, () => new Array(9).fill(0));
  src.forEach(([x, y], i) => {
    const [u, v] = dst[i];
    for (const [r, t] of [[[x, y, 1, 0, 0, 0, -u*x, -u*y], u], [[0, 0, 0, x, y, 1, -v*x, -v*y], v]])
      for (let a = 0; a < 8; a++) { for (let b = 0; b < 8; b++) M[a][b] += r[a] * r[b]; M[a][8] += r[a] * t; }
  });
  for (let c = 0; c < 8; c++) {
    let p = c; for (let r = c + 1; r < 8; r++) if (Math.abs(M[r][c]) > Math.abs(M[p][c])) p = r;
    [M[c], M[p]] = [M[p], M[c]];
    if (Math.abs(M[c][c]) < 1e-12) return null;
    for (let r = 0; r < 8; r++) if (r !== c) { const f = M[r][c] / M[c][c]; for (let k = c; k < 9; k++) M[r][k] -= f * M[c][k]; }
  }
  return M.map((row, i) => row[8] / row[i]);
}
const applyH = (h, [x, y]) => { const w = h[6]*x + h[7]*y + 1; return [(h[0]*x + h[1]*y + h[2]) / w, (h[3]*x + h[4]*y + h[5]) / w]; };

// ordena 4 esquinas: arriba-izq primero, sentido horario
function orderCorners(p){
  const cx = p.reduce((s, q) => s + q[0], 0) / 4, cy = p.reduce((s, q) => s + q[1], 0) / 4;
  const s = [...p].sort((a, b) => Math.atan2(a[1]-cy, a[0]-cx) - Math.atan2(b[1]-cy, b[0]-cx));
  let k = 0; s.forEach((q, i) => { if (q[0] + q[1] < s[k][0] + s[k][1]) k = i; });
  return [...s.slice(k), ...s.slice(0, k)];
}

// ---------- cámara + detector ----------
async function start(){
  try {
    files = await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/wasm');
    landmarker = await makeLandmarker('VIDEO');
  } catch { return fail(t('loadFail')); }
  await openCamera();
  if (!saved.hand) setTimeout(openCal, 400);
}
async function makeLandmarker(runningMode){
  const opts = d => ({ baseOptions: { modelAssetPath: 'hand_landmarker.task', delegate: d }, runningMode, numHands: 1,
    minHandDetectionConfidence: .5, minHandPresenceConfidence: .5, minTrackingConfidence: .5 });
  try { return await HandLandmarker.createFromOptions(files, opts('GPU')); }
  catch { return await HandLandmarker.createFromOptions(files, opts('CPU')); }
}
async function openCamera(){
  if (stream) stream.getTracks().forEach(t => t.stop());
  try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facing, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false }); }
  catch { return fail(t('camFail')); }
  video.srcObject = stream; await video.play();
  video.classList.toggle('mirror', facing === 'user'); canvas.classList.toggle('mirror', facing === 'user'); $('#gl').classList.toggle('mirror', facing === 'user');
  $('#status').hidden = true;
  requestAnimationFrame(loop);
}
function fail(msg){ $('#status').hidden = false; $('#status').innerHTML = `<b>${t('failed')}</b>${msg}`; }

function loop(){
  if (!paused && video.readyState >= 2 && landmarker) {
    const ts = performance.now();
    if (ts > lastTs) { lastTs = ts; handle(landmarker.detectForVideo(video, ts)); }
  }
  requestAnimationFrame(loop);
}

// ---------- medición ----------
// Método principal: distancia 3D del modelo, re-escalada en cada cuadro con el tamaño REAL de tu palma.
// Método alternativo (2D): endereza la imagen usando la forma real de tu palma y mide en ese plano.
function measureFrame(lm, w, b){
  const H = saved.hand.pts;
  const trueSum = PALM_PAIRS.reduce((s, [i, j]) => s + d2(H[i], H[j]), 0);
  const worldSum = PALM_PAIRS.reduce((s, [i, j]) => s + d3(w[i], w[j]), 0);
  const cm3d = d3(w[TIP.thumb], w[b]) * trueSum / worldSum;

  const vw = video.videoWidth, vh = video.videoHeight, px = p => [p.x * vw, p.y * vh];
  const h = homography(PALM.map(i => px(lm[i])), PALM.map(i => H[i]));
  const cm2d = h ? d2(applyH(h, px(lm[TIP.thumb])), applyH(h, px(lm[b]))) : null;

  // qué tan de frente está la palma (normal del plano muñeca–índice–meñique contra el eje de la cámara)
  const u = [w[5].x - w[0].x, w[5].y - w[0].y, w[5].z - w[0].z], v = [w[17].x - w[0].x, w[17].y - w[0].y, w[17].z - w[0].z];
  const n = [u[1]*v[2] - u[2]*v[1], u[2]*v[0] - u[0]*v[2], u[0]*v[1] - u[1]*v[0]];
  const len = Math.hypot(...n), s = n[2] > 0 ? -1 : 1;          // que la normal apunte hacia la cámara
  const nx = s * n[0] / len * (facing === 'user' ? -1 : 1), ny = s * n[1] / len;
  const tilt = Math.acos(Math.min(1, Math.abs(n[2]) / len)) * 180 / Math.PI;
  return { cm3d, cm2d, tilt, nx, ny };
}

const TILT_OK = 25;                       // grados
const RING = 28 * Math.sin(TILT_OK * Math.PI / 180);
function setGuide(state, text, nx = 0, ny = 0, show = false){
  const pill = $('#pill');
  pill.className = 'pill ' + ({ ok: 'ok', warn: 'warn' }[state] || '');
  pill.textContent = text;
  $('#bubble').style.visibility = show ? 'visible' : 'hidden';
  const dot = $('#dot'), r = Math.min(24, Math.hypot(nx, ny) * 28), ang = Math.atan2(ny, nx);
  dot.setAttribute('cx', (Math.cos(ang) * r).toFixed(1)); dot.setAttribute('cy', (Math.sin(ang) * r).toFixed(1));
  const col = state === 'ok' ? '#43C487' : state === 'warn' ? '#EF6F5C' : '#8E9AAB';
  dot.setAttribute('fill', col); $('#ring').setAttribute('stroke', col);
}

function handle(res){
  sizeCanvas(); ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (app === 'plane') return handlePlane(res);
  const lm = res.landmarks && res.landmarks[0], w = res.worldLandmarks && res.worldLandmarks[0];
  if (!lm || !w) {
    recent.length = recent2d.length = 0;
    $('#value').textContent = '—'; $('#alt').textContent = '';
    setGuide('', t('showHand'));
    $('#measure').disabled = true;
    return;
  }
  const b = TIP[mode];
  if (!saved.hand) {
    drawHand(lm, TIP.thumb, b, false);
    $('#value').textContent = '—'; $('#alt').textContent = '';
    setGuide('warn', t('calFirst'));
    $('#measure').disabled = true;
    return;
  }
  const m = measureFrame(lm, w, b);
  tiltS = { x: tiltS.x * .7 + m.nx * .3, y: tiltS.y * .7 + m.ny * .3, a: tiltS.a * .7 + m.tilt * .3 };

  // qué le falta a la posición, en orden de prioridad
  const xs = lm.map(p => p.x), ys = lm.map(p => p.y);
  const size = Math.max(Math.max(...xs) - Math.min(...xs), Math.max(...ys) - Math.min(...ys));
  const cx = (Math.max(...xs) + Math.min(...xs)) / 2, cy = (Math.max(...ys) + Math.min(...ys)) / 2;
  let state = 'ok', msg;
  if (size < .28) { state = 'warn'; msg = t('closer'); }
  else if (size > .92) { state = 'warn'; msg = t('farther'); }
  else if (cx < .15 || cx > .85 || cy < .15 || cy > .85) { state = 'warn'; msg = t('center'); }
  else if (tiltS.a > TILT_OK) { state = 'warn'; msg = Math.abs(tiltS.x) > Math.abs(tiltS.y) ? t('turn') : t('tilt'); }
  const front = state === 'ok';
  if (front) {
    recent.push(m.cm3d); if (recent.length > 15) recent.shift();
    if (m.cm2d) { recent2d.push(m.cm2d); if (recent2d.length > 15) recent2d.shift(); }
    const last = recent.slice(-8), mean = last.reduce((s, v) => s + v, 0) / last.length;
    const sd = Math.sqrt(last.reduce((s, v) => s + (v - mean) ** 2, 0) / last.length);
    msg = last.length >= 5 && sd > .35 ? t('still') : t('ready');
  }
  drawHand(lm, TIP.thumb, b, front);
  if (recent.length) {
    $('#value').innerHTML = `${median(recent).toFixed(1)}<small>cm</small>`;
    $('#alt').textContent = recent2d.length ? t('flat', { v: median(recent2d).toFixed(1) }) : '';
  }
  $('#measure').disabled = !!collecting || !recent.length;

  if (collecting) {
    if (front) { collecting.samples.push(m.cm3d); msg = t('measuring', { p: Math.round(collecting.samples.length / collecting.need * 100) }); }
    if (collecting.samples.length >= collecting.need) { const c = collecting; collecting = null; c.done(median(c.samples)); }
    else if (performance.now() - collecting.t0 > 6000) { collecting = null; toast(t('measureFail')); }
  }
  setGuide(state, msg, tiltS.x, tiltS.y, true);
}

function sizeCanvas(){
  const r = canvas.getBoundingClientRect(), dpr = devicePixelRatio || 1;
  const W = Math.round(r.width * dpr), H = Math.round(r.height * dpr);
  if (canvas.width !== W || canvas.height !== H) { canvas.width = W; canvas.height = H; }
}
function toScreen(p){
  const vw = video.videoWidth, vh = video.videoHeight, W = canvas.width, H = canvas.height;
  const s = Math.max(W / vw, H / vh), ox = (W - vw * s) / 2, oy = (H - vh * s) / 2;
  return [p.x * vw * s + ox, p.y * vh * s + oy];
}
const BONES = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
function drawSkeleton(c, pts, a, b, dpr, good){
  c.lineWidth = (good ? 3 : 2) * dpr; c.strokeStyle = good ? 'rgba(67,196,135,.9)' : 'rgba(255,255,255,.4)';
  c.beginPath(); BONES.forEach(([i, j]) => { c.moveTo(...pts[i]); c.lineTo(...pts[j]); }); c.stroke();
  if (a == null) return;
  c.strokeStyle = '#FFB020'; c.lineWidth = 4 * dpr;
  c.beginPath(); c.moveTo(...pts[a]); c.lineTo(...pts[b]); c.stroke();
  [pts[a], pts[b]].forEach(p => { c.fillStyle = '#FFB020'; c.beginPath(); c.arc(p[0], p[1], 9 * dpr, 0, 7); c.fill(); c.fillStyle = '#1A1204'; c.beginPath(); c.arc(p[0], p[1], 3.5 * dpr, 0, 7); c.fill(); });
}
function drawHand(lm, a, b, good){ drawSkeleton(ctx, lm.map(toScreen), a, b, devicePixelRatio || 1, good); }


// ---------- pestaña Avión: un avión 3D apoyado sobre la mano ----------
// modelos 3D (Sketchfab) — nariz hacia +Z y arriba +Y después de rotY
const MODELS = {
  fw190:    { file: 'models/fw190.glb',    rotY: 0,       credit: 'Fw 190: manilov.ap (CC BY)' },
  spitfire: { file: 'models/spitfire.glb', rotY: 0,       credit: 'Spitfire Mk Vb: philano (CC BY)' },
  zero:     { file: 'models/zero.glb',     rotY: Math.PI, credit: 'A6M2 Zero: Ivon852 (CC BY-SA)' },
  mustang:  { file: 'models/mustang.glb',  rotY: 0,       credit: 'P-51 Mustang: Aaron C. (CC BY-NC)' },
};
const modelCache = {};
let app = 'measure', THREE, buildPlane, GLTFLoader, three = null, planeId = (() => { try { return localStorage.getItem('mano-metro-plane') || 'spitfire'; } catch { return 'spitfire'; } })(), invertUp = false;
const glc = $('#gl');

async function initThree(){
  if (three) return three;
  THREE = await import('three');
  ({ buildPlane } = await import('./planes.js'));
  ({ GLTFLoader } = await import('three/addons/loaders/GLTFLoader.js'));
  const { RoomEnvironment } = await import('three/addons/environments/RoomEnvironment.js');
  const renderer = new THREE.WebGLRenderer({ canvas: glc, alpha: true, antialias: true });
  const scene = new THREE.Scene(), camera = new THREE.OrthographicCamera(0, 1, 0, -1, 1, 6000);
  camera.position.z = 3000;
  scene.add(new THREE.HemisphereLight(0xffffff, 0x3a3f46, 1.7));
  const sun = new THREE.DirectionalLight(0xffffff, 2.2); sun.position.set(.4, 1, .8); scene.add(sun);
  scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), .04).texture;   // reflejos realistas
  const holder = new THREE.Group(); scene.add(holder);
  three = { renderer, scene, camera, holder, plane: null, seen: false };
  setPlane(planeId);
  return three;
}
// carga el modelo real, lo centra y lo deja de largo 1; si falla, usa el avión armado con código
async function loadModel(id){
  if (modelCache[id]) return modelCache[id];
  const M = MODELS[id], g = (await new GLTFLoader().loadAsync(M.file)).scene;
  g.rotation.y = M.rotY;
  const wrap = new THREE.Group(); wrap.add(g); wrap.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(wrap), size = box.getSize(new THREE.Vector3()), ctr = box.getCenter(new THREE.Vector3());
  g.position.sub(ctr);
  const norm = new THREE.Group(); norm.add(wrap); norm.scale.setScalar(1 / size.z);
  return modelCache[id] = norm;
}
async function setPlane(id){
  planeId = id; try { localStorage.setItem('mano-metro-plane', id); } catch {}
  document.querySelectorAll('[data-plane]').forEach(b => b.setAttribute('aria-pressed', b.dataset.plane === id));
  $('#credits').textContent = MODELS[id].credit;
  if (!three) return;
  let model;
  try { toast(t('planeLoading')); model = await loadModel(id); $('#toast').hidden = true; }
  catch { model = buildPlane(THREE, id); }
  if (planeId !== id) return;              // el usuario ya eligió otro mientras cargaba
  if (three.plane) three.holder.remove(three.plane);
  three.plane = model; three.holder.add(model);
}
function sizeGL(){
  const r = glc.getBoundingClientRect(), { renderer, camera } = three;
  const W = Math.round(r.width), H = Math.round(r.height);
  if (camera.right !== W || camera.bottom !== -H) {
    renderer.setPixelRatio(devicePixelRatio || 1); renderer.setSize(W, H, false);
    camera.right = W; camera.bottom = -H; camera.updateProjectionMatrix();
  }
  return [W, H];
}

function handlePlane(res){
  if (!three) return;
  const [W, H] = sizeGL(), { renderer, scene, camera, holder, plane } = three;
  const lm = res.landmarks && res.landmarks[0], w = res.worldLandmarks && res.worldLandmarks[0];
  if (!lm || !w) { holder.visible = false; three.seen = false; renderer.render(scene, camera); setGuide('', t('showHand')); return; }
  setGuide('ok', t('planeHint'));

  // orientación desde los puntos 3D: cola en la muñeca (0), nariz hacia el nudillo del dedo mayor (9)
  const V = p => new THREE.Vector3(p.x, -p.y, -p.z);
  const f = V(w[9]).sub(V(w[0])).normalize();
  const n = new THREE.Vector3().crossVectors(V(w[5]).sub(V(w[0])), V(w[17]).sub(V(w[0]))).normalize();
  const hd = (res.handedness || res.handednesses || [[]])[0][0];
  const label = hd ? hd.categoryName : 'Right';
  const isRight = facing === 'environment' ? label === 'Right' : label === 'Left';
  const up = n.multiplyScalar((isRight ? -1 : 1) * (invertUp ? -1 : 1));   // arriba del avión = dorso de la mano
  up.sub(f.clone().multiplyScalar(up.dot(f))).normalize();
  const left = new THREE.Vector3().crossVectors(up, f);
  const q = new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().makeBasis(left, up, f));

  // posición y tamaño en pantalla (píxeles CSS, igual que el video con object-fit: cover)
  const vw = video.videoWidth, vh = video.videoHeight, s = Math.max(W / vw, H / vh), ox = (W - vw * s) / 2, oy = (H - vh * s) / 2;
  const sp = i => [lm[i].x * vw * s + ox, lm[i].y * vh * s + oy];
  const c = [0, 5, 9, 13, 17].map(sp).reduce((a, p) => [a[0] + p[0] / 5, a[1] + p[1] / 5], [0, 0]);
  const palmLen = Math.hypot(...sp(9).map((v, i) => v - sp(0)[i]));
  const size = palmLen * 2.4;
  const pos = new THREE.Vector3(c[0], -c[1], 0);
  if (!three.seen) { holder.position.copy(pos); holder.quaternion.copy(q); holder.scale.setScalar(size); three.seen = true; }
  else { holder.position.lerp(pos, .45); holder.quaternion.slerp(q, .35); holder.scale.setScalar(holder.scale.x * .7 + size * .3); }
  holder.visible = true;
  if (plane && plane.userData.prop) plane.userData.prop.rotation.z += .9;
  renderer.render(scene, camera);
}

async function setApp(a){
  app = a;
  $('#t-measure').setAttribute('aria-pressed', a === 'measure'); $('#t-plane').setAttribute('aria-pressed', a === 'plane');
  const pl = a === 'plane';
  $('#fingerseg').hidden = pl; $('#measurerow').hidden = pl; $('#hist').hidden = pl; $('#value').hidden = pl; $('#alt').hidden = pl;
  $('#planebar').hidden = !pl; $('#credits').hidden = !pl; glc.hidden = !pl;
  collecting = null;
  if (pl) {
    setGuide('', t('planeLoading'));
    try { await initThree(); setGuide('', t('showHand')); } catch { toast(t('loadFail')); }
  }
}
$('#t-measure').onclick = () => setApp('measure');
$('#t-plane').onclick = () => setApp('plane');
document.querySelectorAll('[data-plane]').forEach(b => b.onclick = () => setPlane(b.dataset.plane));
$('#invert').onclick = () => { invertUp = !invertUp; $('#invert').setAttribute('aria-pressed', invertUp); };

// ---------- calibración con hoja A4 ----------
const cal = { img: null, lm: null, corners: [], drag: -1, view: null, result: null };
const cc = $('#calcanvas'), cctx = cc.getContext('2d');

function openCal(){
  paused = true; collecting = null;
  Object.assign(cal, { img: null, lm: null, corners: [], result: null });
  $('#calview').hidden = false;
  $('#calsteps').hidden = false; $('#calwrap').hidden = true; $('#calbusy').hidden = true; $('#calresult').hidden = true;
  $('#calsave').hidden = true; $('#calphoto').hidden = false;
  refreshCalText();
}
// textos de la calibración según el paso en que está (se repinta al cambiar de idioma)
function refreshCalText(){
  $('#calphoto').textContent = cal.img ? t('otherPhoto') : t('photo');
  if (!cal.img) { $('#caltitle').textContent = t('calTitle'); $('#calhint').innerHTML = saved.hand ? t('calHas') : t('calNew'); return; }
  computeCal();
}
function closeCal(){ $('#calview').hidden = true; paused = false; }
$('#cal').onclick = openCal;
$('#calcancel').onclick = closeCal;
$('#calphoto').onclick = () => { $('#calfile').value = ''; $('#calfile').click(); };

$('#calfile').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  $('#calsteps').hidden = true; $('#calwrap').hidden = true; $('#calbusy').hidden = false; $('#calresult').hidden = true;
  const img = new Image(); img.src = URL.createObjectURL(f);
  try { await img.decode(); } catch { $('#calbusy').textContent = t('openFail'); return; }
  try { if (!imgLandmarker) imgLandmarker = await makeLandmarker('IMAGE'); } catch { $('#calbusy').textContent = t('detFail'); return; }
  const res = imgLandmarker.detect(img);
  const lm = res.landmarks && res.landmarks[0];
  $('#calbusy').hidden = true; $('#calbusy').textContent = t('searching');
  if (!lm) { toast(t('noHand')); openCal(); return; }
  Object.assign(cal, { img, lm: lm.map(p => [p.x * img.naturalWidth, p.y * img.naturalHeight]), corners: [], result: null });
  $('#calwrap').hidden = false; $('#calsave').hidden = false; $('#calsave').disabled = true;
  refreshCalText();
  requestAnimationFrame(drawCal);
};

function calLayout(){
  const r = cc.getBoundingClientRect(), dpr = devicePixelRatio || 1;
  cc.width = Math.round(r.width * dpr); cc.height = Math.round(r.height * dpr);
  const iw = cal.img.naturalWidth, ih = cal.img.naturalHeight, s = Math.min(cc.width / iw, cc.height / ih);
  cal.view = { s, ox: (cc.width - iw * s) / 2, oy: (cc.height - ih * s) / 2, dpr };
}
const imgToCanvas = ([x, y]) => [x * cal.view.s + cal.view.ox, y * cal.view.s + cal.view.oy];
const canvasToImg = ([x, y]) => [(x - cal.view.ox) / cal.view.s, (y - cal.view.oy) / cal.view.s];

function drawCal(){
  if (!cal.img) return;
  calLayout();
  const { s, ox, oy, dpr } = cal.view;
  cctx.clearRect(0, 0, cc.width, cc.height);
  cctx.drawImage(cal.img, ox, oy, cal.img.naturalWidth * s, cal.img.naturalHeight * s);
  drawSkeleton(cctx, cal.lm.map(imgToCanvas), null, null, dpr);
  const pts = cal.corners.length === 4 ? orderCorners(cal.corners) : cal.corners;
  if (pts.length > 1) {
    cctx.strokeStyle = '#FFB020'; cctx.lineWidth = 3 * dpr; cctx.beginPath();
    pts.forEach((p, i) => { const q = imgToCanvas(p); i ? cctx.lineTo(...q) : cctx.moveTo(...q); });
    if (pts.length === 4) cctx.closePath();
    cctx.stroke();
  }
  cal.corners.forEach(p => {
    const [x, y] = imgToCanvas(p);
    cctx.fillStyle = 'rgba(255,176,32,.25)'; cctx.beginPath(); cctx.arc(x, y, 22 * dpr, 0, 7); cctx.fill();
    cctx.fillStyle = '#FFB020'; cctx.beginPath(); cctx.arc(x, y, 6 * dpr, 0, 7); cctx.fill();
  });
}

function pointerPos(e){ const r = cc.getBoundingClientRect(), dpr = devicePixelRatio || 1; return [(e.clientX - r.left) * dpr, (e.clientY - r.top) * dpr]; }
cc.addEventListener('pointerdown', e => {
  if (!cal.img) return;
  try { cc.setPointerCapture(e.pointerId); } catch {}
  const p = pointerPos(e), dpr = cal.view.dpr;
  let best = -1, bd = 44 * dpr;
  cal.corners.forEach((c, i) => { const d = d2(imgToCanvas(c), p); if (d < bd) { bd = d; best = i; } });
  if (best >= 0) cal.drag = best;
  else if (cal.corners.length < 4) { cal.corners.push(canvasToImg(p)); cal.drag = cal.corners.length - 1; }
  computeCal(); drawCal();
});
cc.addEventListener('pointermove', e => { if (cal.drag < 0) return; cal.corners[cal.drag] = canvasToImg(pointerPos(e)); computeCal(); drawCal(); });
cc.addEventListener('pointerup', () => { cal.drag = -1; });
addEventListener('resize', () => { if (!$('#calwrap').hidden) drawCal(); });

function computeCal(){
  const box = $('#calresult');
  if (cal.corners.length < 4) { box.hidden = true; $('#calsave').disabled = true; cal.result = null;
    $('#caltitle').textContent = t('tapCorners', { n: cal.corners.length }); $('#calhint').textContent = t('dragHint'); return; }
  $('#caltitle').textContent = t('review');
  const c = orderCorners(cal.corners);
  const [w, h] = d2(c[0], c[1]) > d2(c[1], c[2]) ? [A4[1], A4[0]] : A4;   // el lado más largo en la foto es el de 29,7
  const H = homography(c, [[0, 0], [w, 0], [w, h], [0, h]]);
  if (!H) { box.hidden = true; $('#calsave').disabled = true; return; }
  const pts = cal.lm.map(p => applyH(H, p));
  const palm = d2(pts[5], pts[17]), length = d2(pts[0], pts[12]), span = d2(pts[4], pts[20]);
  const inside = pts.every(([x, y]) => x > -1 && y > -1 && x < w + 1 && y < h + 1);
  const sane = palm > 5 && palm < 13 && length > 12 && length < 25;
  cal.result = sane && inside ? pts : null;
  box.hidden = false;
  box.innerHTML = `<div><b>${palm.toFixed(1)}</b><span>${t('palmW')}</span></div><div><b>${length.toFixed(1)}</b><span>${t('handLen')}</span></div><div><b>${span.toFixed(1)}</b><span>${t('span')}</span></div>`;
  $('#calhint').textContent = cal.result ? t('ruler') : t('weird');
  $('#calsave').disabled = !cal.result;
}

$('#calsave').onclick = () => {
  if (!cal.result) return;
  saved.hand = { pts: cal.result.map(([x, y]) => [+x.toFixed(3), +y.toFixed(3)]), at: Date.now() };
  save(); recent.length = recent2d.length = 0;
  closeCal(); toast(t('calibrated'));
};

function setMode(m){

  } };
};

function renderHist(){
  const fmt = ts => new Date(ts).toLocaleTimeString(lang === 'es' ? 'es-AR' : 'en-US', { hour: '2-digit', minute: '2-digit' });
  $('#hist').innerHTML = saved.history.map(h => `<div class="chip">${h.cm.toFixed(1)} cm<span>${h.mode === 'index' ? t('idx') : t('pky')} · ${fmt(h.t)}</span></div>`).join('');
}
